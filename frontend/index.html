<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EMS — Event Management, Ticketing & Offline Check-in</title>
    <meta
      name="description"
      content="Event management in the browser: discover events, book tickets, and check in guests with offline-first QR scanning and zero overbooking."
    />
    <meta name="keywords" content="event management, ticketing, conference, offline scanner, QR tickets, EMS" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EMS — Event Management & Ticketing" />
    <meta
      property="og:description"
      content="Discover, book, and check in — all from one beautifully fast event platform."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="EMS Platform" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EMS — Event Management & Ticketing" />
    <meta
      name="twitter:description"
      content="Discover, book, and check in — all from one beautifully fast event platform."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080B14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EMS" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ems_theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background font-sans text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
