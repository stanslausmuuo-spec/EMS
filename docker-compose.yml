version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ems_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ems_db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ems_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
